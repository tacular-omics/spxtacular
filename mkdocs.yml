site_name: spxtacular
site_description: Mass spectrometry spectrum processing in Python.
site_url: https://tacular-omics.github.io/spxtacular/
repo_url: https://github.com/tacular-omics/spxtacular
repo_name: tacular-omics/spxtacular
edit_uri: edit/main/docs/
copyright: Copyright &copy; the spxtacular authors. MIT licence.

# Regenerates the example plots embedded in the guides into docs/plots/ (gitignored),
# and copies the repo-root llms.txt and llms-full.txt into the built site.
hooks:
  - hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  # Without these, `!!! warning` blocks render as literal text rather than callouts.
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - md_in_html
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Spectrum: spectrum.md
      - Deconvolution: deconvolution.md
      - Readers: readers.md
      - Spectral libraries (mzSpecLib): mzspeclib.md
      - Matching, scoring & reporter ions: scoring.md
      - Visualization: visualization.md
  - API reference:
      - API reference: api.md
  - Design records:
      - Polarity, adducts, and isotope models: design/polarity-adducts-and-isotope-roadmap.md
  - Migrating to 0.9: migration.md
  - Changelog: https://github.com/tacular-omics/spxtacular/blob/main/CHANGELOG.md
  - Citation: citation.md
