[project]
name = "spxtacular"
dynamic = ["version"]
description = "Mass spectrometry spectrum processing library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mass spectrometry",
    "spectrum processing",
    "isotope deconvolution",
    "proteomics",
    "metabolomics",
    "lipidomics",
    "glycomics",
]
dependencies = [
    # 1.26.0 is the first numpy with a cp312 wheel, so this is as low as requires-python
    # allows. It binds in `readers` (tdfpy also requires >=1.26) but is a dead letter in
    # `all`, where matchms requires numpy>=2.0.0 at every version we allow.
    "numpy>=1.26",
    # pandas 2.1.1 is the first release with a cp312 wheel, but it requires numpy>=1.26.0
    # with no upper cap while shipping the numpy 1.x ABI, so a resolver may legally pair it
    # with numpy 2.x and the import then fails with "numpy.dtype size changed". 2.1.2 is the
    # first release that caps numpy<2, so this floor skips exactly one installable release
    # on purpose.
    "pandas>=2.1.2",
    "peptacular>=5,<6",
    "tacular>=2,<3",
    "paftacular>=2,<3",
    # plotly and the kaleido floor in `plotly-export` are a pair: static export runs through
    # whichever kaleido API that plotly release knows. plotly 6.1.0 and below drive the
    # kaleido 0.2 `scope` API, which kaleido 1.x removed, so with kaleido>=1.0 they either
    # raise "requires the kaleido package" (<=6.0.1) or write no file at all (6.1.0). 6.1.1 is
    # the first release that exports with kaleido 1.x, measured against kaleido 1.0.0 and
    # 1.5.0, and it is what plotly's own 6.1.0 warning tells users to upgrade to.
    "plotly>=6.1.1",
]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/spxtacular"
Repository = "https://github.com/tacular-omics/spxtacular"
Documentation = "https://tacular-omics.github.io/spxtacular"
Issues = "https://github.com/tacular-omics/spxtacular/issues"
Changelog = "https://github.com/tacular-omics/spxtacular/blob/main/CHANGELOG.md"

[build-system]
# hatchling>=1.27 is required for PEP 639 `license`/`license-files` support.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spxtacular/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spxtacular"]

# Keep the sdist small: tests/data holds ~73 MB of Bruker .d binaries and
# plots/ + docs/plots/ another ~76 MB of generated HTML. None of it needs to
# ship to PyPI (per-file limit is 100 MB).
[tool.hatch.build.targets.sdist]
only-include = [
    "src/spxtacular",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[project.optional-dependencies]
# 0.59.0 is the first numba with a cp312 wheel and the lowest that passes the test suite.
numba = ["numba>=0.59"]
bruker = ["tdfpy>=5,<6"]
mzml = ["mzmlpy>=0.10,<0.11"]
# thermo additionally needs a .NET runtime on the machine (fisher-py wraps
# Thermo's RawFileReader .NET assemblies via pythonnet).
thermo = ["fisher-py>=2.0.2"]
readers = ["tdfpy>=5,<6", "mzmlpy>=0.10,<0.11", "fisher-py>=2.0.2"]
spectrl = ["spectrl>=3.0,<4"]
# matchms 0.30.0 is the lowest release that passes the interop tests. Lowering the floor does
# not free numpy or pandas (0.30.0 also requires numpy>=2.0.0 and pandas>=2.2.3); what it buys
# is matchms's own matplotlib demand dropping from >=3.10.8 to >=3.7.
matchms = ["matchms>=0.30"]
spectrum-utils = ["spectrum-utils>=0.4.0"]
interop = ["matchms>=0.30", "spectrum-utils>=0.4.0"]
# Print figures: backend="matplotlib" (vector PDF/SVG with embedded fonts).
# 3.8 is kept deliberately. matplotlib 3.8-3.10 call pyparsing's deprecated `parseString` and
# `oneOf` aliases, which our test config promotes to failures; that is our config being
# stricter than the library, not an incompatibility users would hit, so it is handled by a
# scoped filter in [tool.pytest.ini_options] instead of by this floor. In `all` the effective
# floor is matchms's >=3.10.8 whatever we declare here.
matplotlib = ["matplotlib>=3.8"]
# Static PNG/SVG/PDF export of plotly figures (save_figure). Needs Chrome/Chromium.
plotly-export = ["kaleido>=1.0"]
all = [
    "numba>=0.59",
    "tdfpy>=5,<6",
    "mzmlpy>=0.10,<0.11",
    "fisher-py>=2.0.2",
    "spectrl>=3.0,<4",
    "matchms>=0.30",
    "spectrum-utils>=0.4.0",
    "matplotlib>=3.8",
    "kaleido>=1.0",
]

[dependency-groups]
# The floors repeated from the runtime extras (fisher-py, matchms, numba, spectrum-utils,
# mzmlpy, spectrl, tdfpy) are deliberate and must move with them. `uv sync --all-extras
# --all-groups --resolution lowest-direct`, which the CI lowest job runs, takes the higher of
# the extra's and this group's requirement, so a dev pin above a runtime floor shadows it and
# the lowest job then never tests the floor we publish.
dev = [
    "fisher-py>=2.0.2",
    "hypothesis>=6.100",
    "jsonschema>=4.25.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "matchms>=0.30",
    "mzmlpy>=0.10,<0.11",
    "numba>=0.59",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-examples>=0.0.18",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16.8",
    "spectrl>=3.0,<4",
    "spectrum-utils>=0.4.0",
    "tdfpy>=5,<6",
    "ty>=0.0.83",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# Left off deliberately: enabling it reformats the ``>>>`` examples in
# core.py/reader.py docstrings, which would be a large unrelated diff.
docstring-code-format = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "NPY", # NumPy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    # Collapsing long numeric if/else blocks into ternaries hurts readability here.
    "SIM108",
    # Docstrings intentionally use scientific unicode (×, −, –).
    "RUF002",
]

# Everything below is a *suppression of a real finding*, added so that enabling
# C4/NPY/PT/RUF/SIM did not leave the repo failing lint. Fix the code and delete
# the entry rather than letting these accumulate.
[tool.ruff.lint.per-file-ignores]
"src/spxtacular/__init__.py" = ["RUF022"]      # `__all__` is not sorted
"src/spxtacular/core.py" = ["SIM401"]          # use `dict.get(key, default)`
"src/spxtacular/decon/scored.py" = ["PT018"]   # compound assertion
"src/spxtacular/plot_table.py" = ["C401", "C408"]
"src/spxtacular/scoring.py" = ["RUF007"]       # prefer `itertools.pairwise()`
"src/spxtacular/visualization.py" = ["C401", "C408"]
"tests/**" = [
    "NPY002",  # legacy `np.random.seed`/`np.random.normal` instead of Generator
    "PT011",   # `pytest.raises(ValueError)` without `match=`
    "PT018",   # compound assertions
    "PT030",   # `pytest.warns(UserWarning)` without `match=`
    "RUF059",  # unused unpacked variable
    "RUF100",  # stale `# noqa: E402` directives
    "SIM117",  # nested `with` statements
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --timeout=15"
filterwarnings = [
    "error",
    # matplotlib 3.8-3.10 reach pyparsing's deprecated camelCase names (`parseString`,
    # `resetCache`, `oneOf`, `enablePackrat`, `endQuoteChar`, `parseAll`) from
    # matplotlib._fontconfig_pattern, matplotlib._mathtext and pyparsing's own alias shim. The
    # warning is matplotlib's and matplotlib still works, so "error" must not turn it into a
    # dependency floor. Scoped to pyparsing's two alias-deprecation messages from those three
    # modules. The category is left open because pyparsing has moved
    # PyparsingDeprecationWarning between DeprecationWarning and UserWarning, and naming the
    # class here would make pytest import pyparsing even in installs with no matplotlib.
    "default:'[A-Za-z_]+' deprecated - use '[A-Za-z_]+':Warning:(matplotlib._(fontconfig_pattern|mathtext)|pyparsing.util)",
    "default:'[A-Za-z_]+' argument is deprecated, use '[A-Za-z_]+':Warning:(matplotlib._(fontconfig_pattern|mathtext)|pyparsing.util)",
]
markers = ["slow: slow test (> ~2 s), skipped unless --run-slow or RUN_SLOW=1 (CI runs them)"]

[tool.coverage.run]
source = ["src/spxtacular"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "class .*\\(Protocol\\):",
]

