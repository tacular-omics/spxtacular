[project]
name = "spxtacular"
dynamic = ["version"]
description = "Mass spectrometry spectrum processing library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mass spectrometry",
    "spectrum processing",
    "isotope deconvolution",
    "proteomics",
    "metabolomics",
    "lipidomics",
    "glycomics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "peptacular>=3.2.0",
    "paftacular>=1.1.0",
    "plotly>=6.6.0",
]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/spxtacular"
Repository = "https://github.com/tacular-omics/spxtacular"
Documentation = "https://tacular-omics.github.io/spxtacular"
Issues = "https://github.com/tacular-omics/spxtacular/issues"
Changelog = "https://github.com/tacular-omics/spxtacular/blob/main/HISTORY.md"

[build-system]
# hatchling>=1.27 is required for PEP 639 `license`/`license-files` support.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/spxtacular/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spxtacular"]

# Keep the sdist small: tests/data holds ~73 MB of Bruker .d binaries and
# plots/ + docs/plots/ another ~76 MB of generated HTML. None of it needs to
# ship to PyPI (per-file limit is 100 MB).
[tool.hatch.build.targets.sdist]
only-include = [
    "src/spxtacular",
    "README.md",
    "HISTORY.md",
    "LICENSE",
    "pyproject.toml",
]

[project.optional-dependencies]
numba = ["numba>=0.64.0"]
bruker = ["tdfpy>=3.0.0"]
mzml = ["mzmlpy>=0.7.0"]
# thermo additionally needs a .NET runtime on the machine (fisher-py wraps
# Thermo's RawFileReader .NET assemblies via pythonnet).
thermo = ["fisher-py>=2.0.0"]
readers = ["tdfpy>=3.0.0", "mzmlpy>=0.7.0", "fisher-py>=2.0.0"]
spectrl = ["spectrl>=1.0.0"]
matchms = ["matchms>=0.33.1"]
spectrum-utils = ["spectrum-utils>=0.5.0"]
interop = ["matchms>=0.33.1", "spectrum-utils>=0.5.0"]
all = [
    "numba>=0.64.0",
    "tdfpy>=3.0.0",
    "mzmlpy>=0.7.0",
    "fisher-py>=2.0.0",
    "spectrl>=1.0.0",
    "matchms>=0.33.1",
    "spectrum-utils>=0.5.0",
]

[dependency-groups]
dev = [
    "fisher-py>=2.0.0",
    "jsonschema>=4.25.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "matchms>=0.33.1",
    "mzmlpy>=0.7.0",
    "numba>=0.64.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14.11",
    "spectrl>=1.0.0",
    "spectrum-utils>=0.5.0",
    "tdfpy>=3.0.0",
    "ty>=0.0.11",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# Left off deliberately: enabling it reformats the ``>>>`` examples in
# core.py/reader.py docstrings, which would be a large unrelated diff.
docstring-code-format = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "NPY", # NumPy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    # Collapsing long numeric if/else blocks into ternaries hurts readability here.
    "SIM108",
    # Docstrings intentionally use scientific unicode (×, −, –).
    "RUF002",
]

# Everything below is a *suppression of a real finding*, added so that enabling
# C4/NPY/PT/RUF/SIM did not leave the repo failing lint. Fix the code and delete
# the entry rather than letting these accumulate.
[tool.ruff.lint.per-file-ignores]
"src/spxtacular/__init__.py" = ["RUF022"]      # `__all__` is not sorted
"src/spxtacular/core.py" = ["SIM401"]          # use `dict.get(key, default)`
"src/spxtacular/decon/scored.py" = ["PT018"]   # compound assertion
"src/spxtacular/plot_table.py" = ["C401", "C408"]
"src/spxtacular/scoring.py" = ["RUF007"]       # prefer `itertools.pairwise()`
"src/spxtacular/visualization.py" = ["C401", "C408"]
"tests/**" = [
    "NPY002",  # legacy `np.random.seed`/`np.random.normal` instead of Generator
    "PT011",   # `pytest.raises(ValueError)` without `match=`
    "PT018",   # compound assertions
    "PT030",   # `pytest.warns(UserWarning)` without `match=`
    "RUF059",  # unused unpacked variable
    "RUF100",  # stale `# noqa: E402` directives
    "SIM117",  # nested `with` statements
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -n 4 --dist loadscope --timeout=15"
filterwarnings = [
    "error",
    # tdfpy leaks its sqlite3 connections; the ResourceWarning surfaces at GC
    # time in unrelated tests and is not actionable from this repo.
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/spxtacular"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "class .*\\(Protocol\\):",
]

