[project]
name = "analysis"
version = "0"
description = "Analysis that produces the manuscript's figures, tables and numbers"
requires-python = ">=3.12"

# Every number and figure in this paper is produced by running spxtacular itself,
# so the library IS the analysis dependency. It is taken from the repository this
# manuscript lives in (../..), not from PyPI: the paper describes the version in
# the working tree, and pulling a released wheel would let the two drift.
#
# kaleido renders the library's own Plotly figures to PNG. The paper's figure is
# a screenshot of the real output rather than a matplotlib redraw of it, which
# for a library whose visualization is a feature is the difference between
# showing the software and describing it.
dependencies = [
  "spxtacular",
  "peptacular>=3.1.2",
  "kaleido>=1.0",
  # tdfpy is what reads the Bruker example run under ../tests/data/. The demo
  # data is the repository's own committed test file, so the figure and the
  # numbers come from a spectrum any reader of the paper can open.
  "tdfpy>=2.0.0",
]

[tool.uv.sources]
spxtacular = { path = "../..", editable = false }

[tool.uv]
package = false
