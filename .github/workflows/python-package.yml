# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Install dependencies
      run: just install
    - name: Lint with ruff
      run: just lint
    - name: Check formatting with ruff
      run: just fmt-check
    - name: Type check with ty
      run: just check
    - name: Test with pytest
      run: just test-cov
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/spxtacular
        fail_ci_if_error: false
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/spxtacular
        report_type: test_results
        fail_ci_if_error: false

  # Guards the CLAUDE.md promise: spxtacular must import with *no* optional
  # extras installed, and DReader/MzmlReader must stay importable while raising
  # ImportError only on instantiation. Downstream libraries (e.g. pydiode)
  # depend on this, so it gets its own job with no dev deps and no extras.
  minimal-install:
    name: Minimal install (no extras, no dev deps)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: "3.12"
    - name: Install the package alone (no extras, no dependency groups)
      run: |
        uv venv
        uv pip install .
    - name: Assert optional backends degrade correctly
      run: uv run --no-project python .github/scripts/check_minimal_install.py
