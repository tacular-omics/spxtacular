# Standard tacular-omics CI. Canonical copy: tacular-omics workspace templates/.
# Package-specific jobs (docs, paper, extras matrices) live in separate workflow
# files or are appended below the standard jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests

  # Proves the declared lower bounds still work: installs the oldest allowed
  # version of every direct dependency.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      - run: uv run pytest tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Import the built wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('${{ github.workspace }}/pyproject.toml','rb'))['project']['name'].replace('-','_'))")
          uv run --isolated --no-project --with "$(ls ${{ github.workspace }}/dist/*.whl)" python -c "import $pkg; print($pkg.__version__)"

  # --- package-specific jobs (kept from the previous CI, action pins updated) ---

  # Builds the wheel and installs it fresh, outside the checkout, on every
  # supported OS/Python combination. A separate lowest-direct-resolution
  # combination proves the wheel also installs at its declared floors.
  wheel:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        resolution: [latest]
        include:
          - os: ubuntu-latest
            python: "3.12"
            resolution: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions
        run: uv build --out-dir wheel-dist
      - name: Test installed wheel outside checkout
        shell: bash
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          args=()
          if [ "$RESOLUTION" = lowest ]
          then
            args+=(--lowest)
          fi
          uv run --no-project python .github/scripts/check_wheel.py wheel-dist "${args[@]}"

  # Thermo reading needs fisher-py's pythonnet/.NET bridge, which is not
  # exercised by the ordinary test matrix above.
  thermo:
    name: Thermo integration with required runtime
    runs-on: ubuntu-latest
    env:
      PYTHONNET_RUNTIME: coreclr
      SPXTACULAR_REQUIRE_THERMO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: uv sync --locked
      - name: Verify backend is usable
        run: uv run python -c "__import__('spxtacular.thermo', fromlist=['_require_fisher'])._require_fisher()"
      - name: Run vendor integration tests
        run: uv run pytest tests/test_thermo.py -n 0 --junitxml=thermo-junit.xml
      - name: Reject skipped integration tests
        run: uv run python .github/scripts/check_no_skips.py thermo-junit.xml

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run mkdocs build --strict

  coverage:
    name: Coverage upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov=src/spxtacular --cov-report=xml --junit-xml=junit.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/spxtacular
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/spxtacular
          report_type: test_results
          fail_ci_if_error: false
