name: Draft PDF

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: JOSS paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # master, verified 2026-09-04
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload draft
        uses: actions/upload-artifact@v7
        with:
          name: joss-paper
          path: paper/paper.pdf
