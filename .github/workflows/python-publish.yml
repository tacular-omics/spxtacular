name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    # Publishing uses PyPI Trusted Publishing (OIDC) rather than a long-lived
    # API token, so no PyPI credentials live in this repo.
    #
    # MAINTAINER SETUP (one time): on https://pypi.org/manage/project/spxtacular/settings/publishing/
    # add a GitHub trusted publisher with
    #   owner: tacular-omics   repository: spxtacular
    #   workflow: python-publish.yml   environment: pypi
    # Then create the `pypi` environment under repo Settings -> Environments
    # and DELETE the now-unused `PYPI_API_TOKEN` repository secret.
    environment:
      name: pypi
      url: https://pypi.org/p/spxtacular

    permissions:
      contents: read
      id-token: write  # required for trusted publishing

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: "3.12"
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
    - name: Install and verify candidate
      run: |
        just install
        just lint
        just fmt-check
        just check
        just test
        just docs-build
    - name: Build package with uv
      run: uv build
    - name: Verify tag and distributions
      run: |
        package_version=$(uv run --locked python -c "print(__import__('spxtacular').__version__)")
        test "v$package_version" = "$GITHUB_REF_NAME"
        uvx twine check dist/*
    - name: Verify installed wheel
      run: uv run --no-project python .github/scripts/check_wheel.py dist
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
